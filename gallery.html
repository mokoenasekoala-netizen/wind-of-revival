<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function(){
 var $=function(i){return document.getElementById(i)},list=[],cur=-1,x0=null;
 function show(i){
  if(i<0||i>=list.length)return;cur=i;var o=list[i],id=WR.id(o),im=$("lbi");
  $("lb").hidden=false;document.body.style.overflow="hidden";
  im.src=WR.f(o,"thumb");im.className="blur";$("lbc").textContent=WR.f(o,"caption");
  WR.doc("gallery",id).then(function(d){if(cur===i&&d&&d.fields){im.src=WR.f(d,"full");im.className=""}});
 }
 function close(){$("lb").hidden=true;document.body.style.overflow="";cur=-1;$("lbi").removeAttribute("src")}
 $("lbx").onclick=close;$("lbp").onclick=function(){show(cur-1)};$("lbq").onclick=function(){show(cur+1)};
 $("lb").onclick=function(e){if(e.target===this)close()};
 document.addEventListener("keydown",function(e){
  if($("lb").hidden)return;
  if(e.key==="Escape")close();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1);
 });
 $("lb").addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
 $("lb").addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1))});
 if(WR.ready){
  WR.list("gallery",100,["caption","thumb"]).then(function(d){
   list=d;var g=$("gg");g.textContent="";
   d.forEach(function(o,i){g.append(WR.tile(o,i,function(){show(i)}))});
   $("none").hidden=d.length>0;
   var h=location.hash.slice(1);if(h){var k=d.findIndex(function(o){return WR.id(o)===h});if(k>-1)show(k)}
  });
 }else $("none").hidden=false;
})();
</script>
