<script>
(function(){
 var $=function(i){return document.getElementById(i)},id=new URLSearchParams(location.search).get("id");
 function nf(){$("nf").hidden=false;$("art").hidden=true;$("t").textContent="Sermon"}
 if(!id||!WR.ready){nf();return}
 WR.sermon(id).then(function(o){
  if(!o||!o.fields){nf();return}
  var f=function(k){return WR.f(o,k)},u=f("url"),em=WR.embed(u);
  $("t").textContent=f("title");document.title=f("title")+" – Wind of Revival International Church";
  $("mt").textContent=[f("speaker"),f("date"),f("scripture")].filter(Boolean).join(" · ");
  if(em){
   var w=document.createElement("div");w.className="live on";w.style.marginBottom="34px";
   var v=document.createElement("div");v.className="vid";
   var fr=document.createElement("iframe");fr.src=em;fr.title=f("title");fr.allow="fullscreen";fr.allowFullscreen=true;
   v.append(fr);w.append(v);$("vid").append(w);
  }else if(/^https?:/.test(u)){
   var a=document.createElement("a");a.className="btn";a.href=u;a.target="_blank";a.rel="noopener";a.textContent="▶ Watch the video";
   var p=document.createElement("p");p.style.textAlign="center";p.style.marginBottom="34px";p.append(a);$("vid").append(p);
  }
  var tx=$("txt");
  f("body").split(/\n\s*\n/).forEach(function(par){
   par=par.trim();if(!par)return;var el;
   if(par.indexOf("## ")===0){el=document.createElement("h3");el.textContent=par.slice(3)}
   else if(par.charAt(0)===">"){el=document.createElement("blockquote");el.textContent=par.replace(/^>\s?/gm,"")}
   else{el=document.createElement("p");el.textContent=par}
   tx.append(el);
  });
  if(!tx.children.length&&f("note")){var n=document.createElement("p");n.textContent=f("note");tx.append(n)}
  var url=location.href.split("#")[0],e=encodeURIComponent;
  $("fbs").href="https://www.facebook.com/sharer/sharer.php?u="+e(url);
  $("was").href="https://wa.me/?text="+e(f("title")+"\n"+url);
 });
 $("cl").onclick=function(){navigator.clipboard.writeText(location.href.split("#")[0]);this.textContent="✔"};
 $("pr").onclick=function(){print()};
})();
</script>
