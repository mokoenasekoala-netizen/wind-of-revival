<h1 data-en="Sermons" data-st="Lithuto">Sermons</h1>
<p data-en="Watch and listen again to the messages from our services." data-st="Sheba 'me u mamele hape melaetsa ea lits'ebeletso tsa rōna.">Watch and listen again to the messages from our services.</p>
</div></div>
<section style="padding-top:50px"><div class="wrap">
<label for="q" class="p" data-en="Search" data-st="Batla">Search</label>
<input id="q" class="srch" type="search" data-en-ph="Title, speaker or scripture" data-st-ph="Sehlooho, mbuelli kapa temana ea Bibele" placeholder="Title, speaker or scripture">
<div class="grid" id="sg"></div>

</div></section>

<svg class="wave" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50 C200 100 400 0 600 40 S1000 90 1200 30 V90 H0Z"/></svg>

</footer>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function(){
 var g=document.getElementById("sg"),q=document.getElementById("q"),none=document.getElementById("none"),all=[];
 function draw(){
  var s=q.value.trim().toLowerCase(),k=0;g.textContent="";
  all.forEach(function(o){
   var t=(WR.f(o,"title")+" "+WR.f(o,"speaker")+" "+WR.f(o,"scripture")+" "+WR.f(o,"note")+" "+WR.f(o,"date")).toLowerCase();
   if(!s||t.indexOf(s)>-1)g.append(WR.card(o,k++%3));
  });
  none.hidden=k>0;
 }
 q.oninput=draw;
 if(WR.ready)WR.sermons(100).then(function(d){all=d;draw()});else draw();
})();
</script>
